[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kgmaker"
version = "0.1.0"
description = "A local, Copilot-native knowledge graph for code repositories"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "kgmaker contributors" }]
dependencies = []

[project.scripts]
kgmaker = "kgmaker.cli:main"

[tool.setuptools]
packages = ["kgmaker", "kgmaker.excel", "kgmaker_workers"]
package-dir = {"" = "src", "kgmaker_workers" = "workers"}
include-package-data = false

[tool.setuptools.package-data]
kgmaker_workers = [
  "typescript/worker.cjs", "typescript/input_snapshot.cjs", "typescript/ui_events.cjs", "typescript/frontend_values.cjs", "typescript/package.json", "typescript/package-lock.json",
  "typescript/node_modules/typescript/package.json",
  "typescript/node_modules/typescript/LICENSE.txt",
  "typescript/node_modules/typescript/ThirdPartyNoticeText.txt",
  "typescript/node_modules/typescript/lib/*", "typescript/node_modules/typescript/lib/*/*.json",
  "jvm/build.py", "jvm/fetch_k2.py", "jvm/pom.xml", "jvm/dependencies.lock.json",
  "jvm/dependencies-k2.lock.json", "jvm/k2/*.kt",
  "jvm/src/main/java/org/kgmaker/worker/*.java",
  "jvm/src/main/kotlin/org/kgmaker/worker/*.kt",
  "jvm/target/kgmaker-jvm-worker*.jar", "jvm/target/lib/*.jar",
  "jvm/target/licenses/**/*",
  "jvm/target-k2/kgmaker-jvm-worker*.jar", "jvm/target-k2/lib/*.jar",
  "jvm/target-k2/licenses/**/*",
  "build/build.py", "build/gradle/export.gradle",
  "build/maven/BuildExport.java", "build/maven/components.xml",
  "build/maven/target/kgmaker-build-export.jar",
  "build/exporters.json", "build/LICENSE",
  "excel/pom.xml", "excel/dependencies.lock.json", "excel/verify_distribution.py",
  "excel/src/main/java/org/kgmaker/excel/*.java",
  "excel/target/kgmaker-excel-worker.jar", "excel/target/lib/*.jar",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
