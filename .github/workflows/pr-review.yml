name: PR Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  review:
    runs-on: ubuntu-latest
    name: Review Pull Request

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Checkout base branch
        run: |
          git fetch origin ${{ github.base_ref }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install kgmaker and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pylint black isort pytest pytest-cov

      - name: Run code quality checks
        id: quality
        run: |
          echo "Running code quality analysis..." >> $GITHUB_STEP_SUMMARY
          
          # Check code style with black
          echo "## Code Style Check (Black)" >> $GITHUB_STEP_SUMMARY
          black --check src/ tests/ 2>&1 | tee black_output.txt || true
          
          # Check import sorting with isort
          echo "## Import Sorting Check (isort)" >> $GITHUB_STEP_SUMMARY
          isort --check-only --diff src/ tests/ 2>&1 | tee isort_output.txt || true
          
          # Run pylint
          echo "## Code Quality Check (Pylint)" >> $GITHUB_STEP_SUMMARY
          pylint src/ --disable=all --enable=E,F 2>&1 | tee pylint_output.txt || true
          
          # Store outputs
          echo "black_output<<EOF" >> $GITHUB_OUTPUT
          cat black_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run tests and coverage
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          test_status=0
          python -m pytest -v --cov=src --cov-report=xml --cov-report=term tests/ 2>&1 | tee pytest_output.txt || test_status=$?
          
          # Extract coverage percentage
          COVERAGE=$(grep "TOTAL" pytest_output.txt | awk '{print $NF}' | tr -d '%' || echo "0")
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          
          cat pytest_output.txt >> $GITHUB_STEP_SUMMARY
          exit "$test_status"

      - name: Analyze PR changes against requirements
        id: requirements
        run: |
          python - << 'EOF'
          import os
          import re
          from pathlib import Path
          
          # Get list of changed files
          changed_files = os.popen('git diff --name-only origin/${{ github.base_ref }}...HEAD').read().strip().split('\n')
          
          issues = []
          warnings = []
          
          for file in changed_files:
              if not file or file.startswith('.'):
                  continue
                  
              try:
                  with open(file, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
                  
                  # Check for missing docstrings in functions
                  functions = re.findall(r'def\s+(\w+)\s*\(', content)
                  docstrings = len(re.findall(r'""".*?"""', content, re.DOTALL))
                  
                  if functions and docstrings < len(functions) * 0.5:
                      warnings.append(f"{file}: Missing docstrings ({docstrings}/{len(functions)})")
                  
                  # Check for TODO/FIXME
                  todos = re.findall(r'(TODO|FIXME):', content)
                  if todos:
                      warnings.append(f"{file}: Contains {len(todos)} TODO/FIXME comments")
                  
                  # Check for type hints
                  if file.endswith('.py') and 'def ' in content:
                      type_hinted = len(re.findall(r'->\s*\w+', content))
                      functions_count = len(functions)
                      if functions_count > 0 and type_hinted < functions_count * 0.5:
                          warnings.append(f"{file}: Low type hint coverage ({type_hinted}/{functions_count})")
                      
              except Exception as e:
                  issues.append(f"Error analyzing {file}: {str(e)}")
          
          print("## Requirements Analysis")
          if issues:
              print("❌ **Issues Found:**")
              for issue in issues:
                  print(f"  - {issue}")
          
          if warnings:
              print("⚠️ **Warnings:**")
              for warning in warnings:
                  print(f"  - {warning}")
          
          if not issues and not warnings:
              print("✅ No major requirement violations detected")
          
          EOF

      - name: Create review comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            const qualityCheck = `${{ steps.quality.outputs.black_output }}`;
            const coverage = `${{ steps.tests.outputs.coverage }}`;
            const testsStatus = `${{ steps.tests.outcome }}`;
            
            let reviewBody = `# 🔍 Automated PR Review\n\n`;
            
            reviewBody += `## Summary\n`;
            reviewBody += `- **Code Quality**: Analyzed with Black, isort, and Pylint\n`;
            reviewBody += `- **Test Coverage**: ${coverage}%\n`;
            reviewBody += `- **Test Status**: ${testsStatus === 'success' ? '✅ Passed' : '⚠️ ' + testsStatus}\n\n`;
            
            reviewBody += `## Checklist\n`;
            reviewBody += `- [ ] Code follows project style guidelines (Black)\n`;
            reviewBody += `- [ ] Imports are properly sorted (isort)\n`;
            reviewBody += `- [ ] All tests pass\n`;
            reviewBody += `- [ ] Test coverage is adequate (> 80%)\n`;
            reviewBody += `- [ ] Docstrings are present\n`;
            reviewBody += `- [ ] Type hints are used\n`;
            reviewBody += `- [ ] No TODO/FIXME comments remain\n`;
            reviewBody += `- [ ] Code matches requirements\n\n`;
            
            reviewBody += `## Details\n`;
            reviewBody += `See the GitHub Actions run for detailed output: ${context.payload.pull_request.html_url}/checks\n`;
            
            // Post comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reviewBody
            });

      - name: Set review status
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "✅ Review passed - ready for fix agent"
          else
            echo "⚠️ Review found issues - manual review required"
          fi
