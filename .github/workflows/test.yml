name: Test

on:
  push:
  pull_request:

jobs:
  windows-user-install:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.6"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Actual non-admin installation in user-space paths with spaces
        shell: powershell
        run: |
          $space = Join-Path $env:USERPROFILE 'KGMAKER user space'
          $source = Join-Path $space 'source checkout'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force | Where-Object { $_.Name -ne '.git' } | Copy-Item -Destination $source -Recurse
          $python = (Get-Command python.exe).Source
          $powershell = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $script = Join-Path $source 'tests/windows/no_admin_smoke.ps1'
          $launcher = Join-Path $source 'tests/windows/restricted_launcher.py'
          $launcherLog = Join-Path $space 'restricted-launcher.log'
          # Documented restricted-token APIs need no interactive runas console.
          # The child independently rejects enabled administrator membership.
          & $python $launcher --root $space -- $powershell -NoProfile -ExecutionPolicy Bypass -File $script -Python $python -WorkRoot $space 2>&1 | Tee-Object -FilePath $launcherLog
          $launcherExit = $LASTEXITCODE
          Write-Output "Restricted launcher exit code: $launcherExit"
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-15); Id = 1000,1001 } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'powershell.exe|python.exe|cmd.exe' } |
            Format-List TimeCreated,Id,Message | Out-String | Tee-Object -FilePath (Join-Path $space 'startup-events.log')
          $resultPath = Join-Path $space 'result.json'
          $logPath = Join-Path $space 'restricted-smoke.log'
          if (Test-Path -LiteralPath $logPath) { Get-Content -LiteralPath $logPath }
          if ($launcherExit -ne 0) { throw "Restricted launcher failed (exit $launcherExit); see launcher/transcript logs" }
          if (-not (Test-Path -LiteralPath $resultPath)) { throw 'Restricted child produced no result marker' }
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if ($result.exit_code -ne 0 -or $result.is_admin) { throw $result.message }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-restricted-install-smoke
          path: |
            ~/KGMAKER user space/*.log
            ~/KGMAKER user space/*.json

  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest==8.3.4 jsonschema==4.23.0 setuptools==84.2.1 wheel==0.48.0
      - run: python -m pytest -q
      - run: kgmaker check

  compiler-workers:
    runs-on: ubuntu-latest
    env:
      KGMAKER_REQUIRE_WORKERS: "1"
      KGMAKER_REQUIRE_K2: "1"
      KGMAKER_REQUIRE_SPRING_IMPORTS: "1"
      KGMAKER_REQUIRE_HTTP_PROVIDERS: "1"
      KGMAKER_REQUIRE_SPRING_CONDITIONS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.6"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - run: python -m pip install -e . pytest==8.3.4 jsonschema==4.23.0 setuptools==84.2.1 wheel==0.48.0
      - name: Install pinned worker/build distributions explicitly
        run: |
          mkdir -p "$RUNNER_TEMP/kgmaker-tools"
          curl --fail --location --output "$RUNNER_TEMP/kgmaker-tools/maven.tar.gz" https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz
          echo "a555254d6b53d267965a3404ecb14e53c3827c09c3b94b5678835887ab404556bfaf78dcfe03ba76fa2508649dca8531c74bca4d5846513522404d48e8c4ac8b  $RUNNER_TEMP/kgmaker-tools/maven.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/kgmaker-tools/maven.tar.gz" -C "$RUNNER_TEMP/kgmaker-tools"
          curl --fail --location --output "$RUNNER_TEMP/kgmaker-tools/kotlin.zip" https://github.com/JetBrains/kotlin/releases/download/v2.1.10/kotlin-compiler-2.1.10.zip
          echo "c6e9e2636889828e19c8811d5ab890862538c89dc2a3101956dfee3c2a8ba6b1  $RUNNER_TEMP/kgmaker-tools/kotlin.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/kgmaker-tools/kotlin.zip" -d "$RUNNER_TEMP/kgmaker-tools"
          echo "$RUNNER_TEMP/kgmaker-tools/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/kgmaker-tools/kotlinc/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --prefix workers/typescript
      - run: npm ci --ignore-scripts --prefix fixtures/build-inspection/frontend
      - name: Build actual mixed fixture and trusted workers
        run: |
          mvn -B -ntp -f fixtures/build-inspection/maven/pom.xml test
          mvn -B -ntp -f fixtures/spring-imports/pom.xml compile
          mvn -B -ntp -f fixtures/data-resources/pom.xml compile
          mvn -B -ntp -f fixtures/http-provider-projection/pom.xml compile
          mvn -B -ntp -f fixtures/spring-conditions/pom.xml compile
          mvn -B -ntp -f fixtures/process-triggers/pom.xml compile
          mvn -B -ntp -f fixtures/http-client-execution/pom.xml compile
          python workers/jvm/build.py --kotlin-home "$RUNNER_TEMP/kgmaker-tools/kotlinc" --maven-repository "$HOME/.m2/repository" --java-home "$JAVA_HOME"
          python workers/jvm/fetch_k2.py --output "$RUNNER_TEMP/kgmaker-tools/k2"
          python workers/jvm/build.py --backend k2 --analysis-api-home "$RUNNER_TEMP/kgmaker-tools/k2" --kotlin-home "$RUNNER_TEMP/kgmaker-tools/kotlinc" --maven-repository "$HOME/.m2/repository" --java-home "$JAVA_HOME"
          python workers/build/build.py --maven-home "$RUNNER_TEMP/kgmaker-tools/apache-maven-3.9.9" --java-home "$JAVA_HOME"
      - run: python -m pytest -q tests/test_mandatory_worker_ci.py tests/test_compiler_workers.py tests/test_worker_protocol.py tests/test_control_flow.py tests/test_build_runner.py tests/test_worker_install.py tests/test_k2_backend.py tests/test_typescript_project_references.py tests/test_spring_imports.py tests/test_spring_imports_context.py tests/test_default_body_mapping.py tests/test_t015_project_data_resources.py tests/test_tsconfig_freshness.py tests/test_typescript_callbacks.py tests/test_typescript_callback_projects.py tests/test_typescript_callback_limits.py tests/test_dependency_dispatch.py tests/test_t010_catalog_http_providers.py tests/test_t010_compiler_providers.py tests/test_spring_registrations.py tests/test_spring_conditions.py tests/test_coroutine_mapping.py tests/test_t024_discover_process_triggers.py tests/test_jvm_golden_corpus.py tests/test_http_client_execution.py tests/test_http_provider_privacy_integration.py tests/test_argument_parameter_flow.py tests/test_ui_events.py tests/test_t025_build_local_process_path.py tests/test_kafka_bindings.py tests/test_orm_xml_overrides.py tests/test_persistence_realms.py tests/test_schema_compatibility.py
      - name: Explicit Maven plan/runner/export
        run: |
          kgmaker project build-plan --root fixtures/build-inspection/maven --phase test --output "$RUNNER_TEMP/kgmaker-plan.json"
          kgmaker project build-run --plan "$RUNNER_TEMP/kgmaker-plan.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-maven-build-results
          path: fixtures/build-inspection/maven/.kgmaker/build-runs/

  rendering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - run: python -m pip install -e . jsonschema==4.23.0
      - run: npm ci --ignore-scripts --prefix workers/typescript
      - run: npm ci --ignore-scripts --prefix fixtures/build-inspection/frontend
      - run: npm ci --ignore-scripts --prefix tests/rendering
      - run: python tests/rendering/generate.py --output /tmp/kgmaker-render
      - run: node tests/rendering/validate.mjs /tmp/kgmaker-render/flow.mmd /tmp/kgmaker-render/flow.json

  gradle-build-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"
      - run: python -m pip install -e . pytest==8.3.4 setuptools==84.2.1 wheel==0.48.0
      - name: Explicitly prepare Maven exporter for installed-wheel acceptance
        run: |
          mkdir -p "$RUNNER_TEMP/kgmaker-tools"
          curl --fail --location --output "$RUNNER_TEMP/kgmaker-tools/maven.tar.gz" https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz
          echo "a555254d6b53d267965a3404ecb14e53c3827c09c3b94b5678835887ab404556bfaf78dcfe03ba76fa2508649dca8531c74bca4d5846513522404d48e8c4ac8b  $RUNNER_TEMP/kgmaker-tools/maven.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/kgmaker-tools/maven.tar.gz" -C "$RUNNER_TEMP/kgmaker-tools"
          python workers/build/build.py --maven-home "$RUNNER_TEMP/kgmaker-tools/apache-maven-3.9.9" --java-home "$JAVA_HOME"
          echo "$RUNNER_TEMP/kgmaker-tools/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/kgmaker-tools/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Actual Maven and Gradle exports from an offline-installed wheel
        env:
          KGMAKER_REQUIRE_EXPORTERS: "1"
        run: python -m pytest -q tests/test_exporter_distribution.py
      - name: Explicit actual Gradle source-set export and test build
        run: |
          kgmaker project build-plan --root fixtures/build-inspection/gradle --phase test --output "$RUNNER_TEMP/kgmaker-gradle-plan.json"
          kgmaker project build-run --plan "$RUNNER_TEMP/kgmaker-gradle-plan.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-gradle-build-results
          path: fixtures/build-inspection/gradle/.kgmaker/build-runs/
