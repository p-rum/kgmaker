3. Ověř cílovou větev, otevřené PR a všechny závislosti uvedené v zadání. Nesplněnou závislost oznam jako BLOCKED; nenahrazuj ji domněnkou.
4. Pracuj v izolovaném git worktree na samostatné větvi `feat/t003-s10-05-selective-feature-revise`. Nepřepínej větev sdíleného parent worktree, nepřepisuj existující cizí větev a neslučuj do této větve jiný work package.

Implementace a evidence:
1. Nejprve zapiš nebo identifikuj failing acceptance test pro konkrétní kritéria T003-S10-W05-ACxx.
2. Implementuj celý rozsah tohoto zadání v existujících modelech, store, workspace, availability a evidence vrstvách. Zachovej uvedené non-goals, kompatibilitu a nulovou mutaci při chybě.
3. Přidej smysluplné pozitivní, negativní a nejednoznačné testy vyžadované zadáním. Chybějící povinný toolchain vykazuj jako SKIP/BLOCKED, nikdy jako PASS.
4. Aktualizuj všechny dokumenty vyžadované zadáním, zejména acceptance inventář, stavovou matici a nový český `docs/changes/<N>_<shortName>.md` s přesnými příkazy, výsledky, neprovedenými kontrolami a zbývajícími omezeními.
5. Dolož změnu přímo zdrojem, testy a change note. Nevytvářej vlastní graf, semantic patch, memory ani task/workflow artefakty KGMAKERu.

Dokončení:
1. Spusť cílené testy, požadovaný skutečný toolchain test, celý `python3 -m pytest -q` a `git diff --check`. Zkontroluj čistotu diffu a nulové implicitní procesy v offline cestách.
